<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="URLL">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b2670"/>
      <stop offset="0.55" stop-color="#1b1a4a"/>
      <stop offset="1" stop-color="#3a2161"/>
    </linearGradient>
    <radialGradient id="glowC" cx="0.3" cy="0.25" r="0.6">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="0.8" cy="0.85" r="0.55">
      <stop offset="0" stop-color="#ff8fb1" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ff8fb1" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="capTop" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e9f7"/>
    </linearGradient>
    <linearGradient id="capSide" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8bfdc"/>
      <stop offset="1" stop-color="#8d93bd"/>
    </linearGradient>
    <linearGradient id="link" gradientUnits="userSpaceOnUse" x1="262" y1="564" x2="762" y2="404">
      <stop offset="0" stop-color="#0ea5e9"/>
      <stop offset="0.55" stop-color="#f0609a"/>
      <stop offset="1" stop-color="#ffb020"/>
    </linearGradient>
    <linearGradient id="earFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e9f7"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="sq"><rect x="0" y="0" width="1024" height="1024" rx="230"/></clipPath>
  </defs>

  <g clip-path="url(#sq)">
    <rect width="1024" height="1024" fill="url(#bg)"/>
    <rect width="1024" height="1024" fill="url(#glowC)"/>
    <rect width="1024" height="1024" fill="url(#glowP)"/>
    <!-- stars -->
    <g fill="#fff6c8">
      <path d="M812 176 l14 -44 l14 44 l44 14 l-44 14 l-14 44 l-14 -44 l-44 -14 z"/>
      <circle cx="196" cy="214" r="9" opacity="0.8"/>
      <circle cx="884" cy="430" r="7" opacity="0.6"/>
      <circle cx="150" cy="790" r="7" opacity="0.5"/>
      <path d="M232 868 l7 -22 l7 22 l22 7 l-22 7 l-7 22 l-7 -22 l-22 -7 z" opacity="0.8"/>
    </g>

    <!-- keycap shadow -->
    <rect x="232" y="300" width="560" height="520" rx="130" fill="#0b0a2a" opacity="0.55" filter="url(#soft)"/>
    <!-- keycap side -->
    <rect x="212" y="250" width="600" height="560" rx="140" fill="url(#capSide)"/>
    <!-- cat ears -->
    <path d="M262 320 L286 110 L452 236 Z" fill="url(#earFill)" stroke="#c9cfe6" stroke-width="6" stroke-linejoin="round"/>
    <path d="M762 320 L738 110 L572 236 Z" fill="url(#earFill)" stroke="#c9cfe6" stroke-width="6" stroke-linejoin="round"/>
    <path d="M306 262 L318 166 L400 226 Z" fill="#ffb3c4"/>
    <path d="M718 262 L706 166 L624 226 Z" fill="#ffb3c4"/>
    <!-- keycap top -->
    <rect x="212" y="214" width="600" height="540" rx="140" fill="url(#capTop)" stroke="#c9cfe6" stroke-width="6"/>
    <rect x="262" y="250" width="500" height="460" rx="110" fill="#ffffff" opacity="0.65"/>

    <!-- link glow -->
    <g transform="rotate(-45 512 484)" filter="url(#soft)" opacity="0.35">
      <rect x="262" y="404" width="300" height="160" rx="80" fill="none" stroke="url(#link)" stroke-width="64"/>
      <rect x="462" y="404" width="300" height="160" rx="80" fill="none" stroke="url(#link)" stroke-width="64"/>
    </g>
    <!-- chain link (interlocked) -->
    <g transform="rotate(-45 512 484)" fill="none">
      <rect x="262" y="404" width="300" height="160" rx="80" stroke="url(#link)" stroke-width="58"/>
      <rect x="462" y="404" width="300" height="160" rx="80" stroke="#ffffff" stroke-width="84"/>
      <rect x="462" y="404" width="300" height="160" rx="80" stroke="url(#link)" stroke-width="58"/>
      <path d="M430 404 H482 A80 80 0 0 1 562 484" stroke="#ffffff" stroke-width="84"/>
      <path d="M420 404 H482 A80 80 0 0 1 562 484" stroke="url(#link)" stroke-width="58"/>
      <!-- highlights -->
      <path d="M330 386 h90" stroke="#ffffff" stroke-opacity="0.75" stroke-width="12" stroke-linecap="round"/>
      <path d="M600 386 h90" stroke="#ffffff" stroke-opacity="0.75" stroke-width="12" stroke-linecap="round"/>
    </g>
  </g>
</svg>
